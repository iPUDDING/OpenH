name: Build OpenHub para Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Verificar frontend
        run: |
          npm run typecheck
          npm test

      - name: Compilar Tauri y generar instaladores
        run: npm run tauri build
        env:
          CI: true

      - name: Publicar instaladores Windows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openhub-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
