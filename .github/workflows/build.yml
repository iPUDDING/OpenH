name: Build y publicar OpenHub para Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhub-windows-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Asignar versión creciente
        shell: bash
        run: |
          VERSION=$(node -e "const parts=require('./package.json').version.split('.');process.stdout.write(parts[0]+'.'+parts[1]+'.'+process.env.GITHUB_RUN_NUMBER)")
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_BODY=Actualización automática de OpenHub. Commit de origen: ${GITHUB_SHA}" >> "${GITHUB_ENV}"
          if [[ "${IS_RELEASE}" == "true" ]]; then
            echo "RELEASE_TAG=v${VERSION}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_TAG=" >> "${GITHUB_ENV}"
          fi
          node -e "const fs=require('fs');const version=process.env.RELEASE_VERSION;const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=version;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));lock.version=version;if(lock.packages&&lock.packages[''])lock.packages[''].version=version;fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');const config=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));config.version=version;if(process.env.IS_RELEASE!=='true')config.bundle.createUpdaterArtifacts=false;fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(config,null,2)+'\n');"

      - name: Verificar secretos de publicación
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENH_UPDATE_REPO_TOKEN: ${{ secrets.OPENH_UPDATE_REPO_TOKEN }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${OPENH_UPDATE_REPO_TOKEN}" ]]; then
            echo "Faltan secretos obligatorios. Revisa docs/ACTUALIZACIONES.md antes de publicar."
            exit 1
          fi

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Verificar frontend
        run: |
          npm run typecheck
          npm test

      - name: Compilar, firmar y publicar release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.OPENH_UPDATE_REPO_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: OpenHub v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          owner: iPUDDING
          repo: OpenH-updates
          uploadUpdaterJson: ${{ env.IS_RELEASE }}
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

      - name: Publicar instaladores como artifact del workflow
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openhub-windows-${{ env.RELEASE_VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
